name: deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: default
    container:
      image: node:24-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v7

      - uses: https://github.com/actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: https://github.com/BunnyWay/actions/deploy-site@deploy-site_0.1.2
        with:
          site: "vixen-lgbt"
          directory: "build"
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
